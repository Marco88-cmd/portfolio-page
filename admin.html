<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Portfolio admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/style.css">
</head>
<body class="font-sans antialiased">

<header class="mx-auto flex h-16 max-w-3xl items-center justify-between px-5">
  <h1 class="font-display text-lg font-bold">Portfolio admin</h1>
  <div class="flex items-center gap-3">
    <a href="/" class="text-sm font-medium text-muted underline underline-offset-4">View site</a>
    <button id="signout" type="button" hidden class="rounded-lg border-2 border-ink px-4 py-2 text-sm font-semibold">Sign out</button>
  </div>
</header>

<main class="mx-auto max-w-3xl px-5 pb-20">
  <p id="config-msg" hidden class="mt-4 rounded-lg border-2 border-ink p-3 font-semibold">Supabase is not configured. Check your .env.local file (or the Vercel environment variables) and restart.</p>

  <section id="login" hidden class="mt-6 rounded-xl border border-line bg-surface p-6">
    <h2 class="font-display text-2xl font-bold">Sign in</h2>
    <form id="login-form">
      <label class="mt-4 block font-medium" for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required class="mt-1 w-full rounded-lg border border-line bg-page px-4 py-3">
      <label class="mt-4 block font-medium" for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required class="mt-1 w-full rounded-lg border border-line bg-page px-4 py-3">
      <button class="mt-6 rounded-lg bg-accent px-6 py-3.5 font-semibold text-onaccent">Sign in</button>
    </form>
    <p id="login-msg"></p>
  </section>

  <div id="dash" hidden>
    <section class="mt-6 rounded-xl border border-line bg-surface p-6">
      <h2 class="font-display text-2xl font-bold">New project</h2>
      <form id="project-form">
        <label class="mt-4 block font-medium" for="title">Title</label>
        <input id="title" required maxlength="80" class="mt-1 w-full rounded-lg border border-line bg-page px-4 py-3">

        <label class="mt-4 block font-medium" for="type">Type</label>
        <input id="type" list="types" required maxlength="40" placeholder="Pick one or write your own" class="mt-1 w-full rounded-lg border border-line bg-page px-4 py-3">
        <datalist id="types"><option value="Landing page"><option value="Local business site"><option value="Multi-page site"><option value="Delivered client site"></datalist>

        <label class="mt-4 block font-medium" for="description">Description</label>
        <textarea id="description" rows="3" required maxlength="280" class="mt-1 w-full rounded-lg border border-line bg-page px-4 py-3"></textarea>

        <label class="mt-4 block font-medium" for="url">Live site link</label>
        <input id="url" type="url" required placeholder="https://" class="mt-1 w-full rounded-lg border border-line bg-page px-4 py-3">

        <label class="mt-4 block font-medium" for="image">Screenshot</label>
        <input id="image" type="file" accept="image/png,image/jpeg,image/webp" class="mt-1 w-full rounded-lg border border-line bg-page px-4 py-3">
        <p class="mt-1 text-sm text-muted">JPG, PNG or WebP, under 3 MB. About 1600 by 1000 pixels works best.</p>

        <label class="mt-4 flex items-center gap-3 font-medium"><input id="published" type="checkbox" checked class="h-5 w-5"> Show on my portfolio</label>

        <button id="save" class="mt-6 rounded-lg bg-accent px-6 py-3.5 font-semibold text-onaccent disabled:opacity-60">Save project</button>
      </form>
      <p id="form-msg"></p>
    </section>

    <section class="mt-10">
      <h2 class="font-display text-2xl font-bold">Your projects</h2>
      <div id="list" class="mt-4 space-y-3"></div>
    </section>
  </div>
</main>

<script type="module" src="/src/admin.js"></script>
</body>
</html>
